name: Build DesktopPet

on: [push]

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        run: choco install nsis

      - name: Install SFML via vcpkg (static)
        run: vcpkg install sfml:x64-windows-static

      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (create installer)
        working-directory: build
        run: cpack -C Release

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-Windows-Installer
          path: build/DesktopPet-1.0-win64.exe

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SFML
        run: brew install sfml

      - name: Convert iconset to .icns
        # iconutil is built into macOS — converts the iconset folder to .icns
        run: iconutil -c icns res/DesktopPet.iconset -o res/icon.icns

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - build/DesktopPet.app

      - name: Package (create dmg)
        working-directory: build
        run: cpack -C Release

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-macOS
          path: build/DesktopPet-1.0-macos.dmg